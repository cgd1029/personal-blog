# Butterfly 主题的独立配置文件。
# 文件名中的 butterfly 与 _config.yml 里的 theme: butterfly 对应。
# 这里只填写当前阶段需要覆盖的选项；未填写的选项继续使用主题默认值。

# 导航栏：控制网站顶部导航区域的基础显示方式。
nav:
  # logo：导航栏图标；留空时不显示单独的导航图标。
  logo:
  # display_title：是否在导航栏显示网站标题。
  display_title: true
  # display_post_title：进入文章后是否在导航栏显示文章标题。
  display_post_title: true
  # fixed：页面滚动时是否固定导航栏。
  fixed: false

# menu：配置导航菜单，格式为“显示名称: 页面路径 || 图标类名”。
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  图库: /gallery/ || fas fa-images
  音乐: /music/ || fas fa-music
  关于: /about/ || fas fa-user
  GitHub: https://github.com/cgd1029 || fab fa-github

# social：侧栏使用的社交链接，键为图标类名，值包含地址、说明和图标颜色。
social:
  fab fa-github: https://github.com/cgd1029 || GitHub || '#24292e'

# favicon：浏览器标签页图标；当前使用 Butterfly 自带图标。
favicon: /img/favicon.png

# avatar：侧栏头像；图片来自 source/img/头像.jpg。
avatar:
  # img：浏览器访问路径；Hexo 会把 source/img/头像.jpg 复制到 public/img/头像.jpg。
  img: /img/头像.jpg
  # effect：是否让头像持续旋转。
  effect: false

# default_top_img：页面顶部默认大图；未单独指定顶部图的页面都会使用它。
default_top_img: /img/背景.jpg

# background：整个网站的背景，可以填写颜色或图片访问路径。
background: /img/背景.jpg

# subtitle：首页副标题；当前先关闭，后续确定文案后再启用。
subtitle:
  enable: false
  effect: true
  source: false
  sub:

# search：配置 Butterfly 提供的站内搜索界面和交互方式。
search:
  # use：选择 local_search，表示在浏览器中读取本地生成的 search.json。
  use: local_search
  # placeholder：搜索输入框为空时显示的提示文字。
  placeholder: 输入文章标题或正文关键词
  # local_search：本地搜索的结果加载和显示规则。
  local_search:
    # preload：false 表示用户打开搜索框时再加载索引，减少首页首次加载量。
    preload: false
    # top_n_per_article：每篇文章最多显示一段匹配正文。
    top_n_per_article: 1
    # unescape：false 表示不额外还原搜索索引中的 HTML 转义字符。
    unescape: false
    # pagination：当前文章较少，不对搜索结果分页。
    pagination:
      enable: false
      hitsPerPage: 8
    # CDN：留空时从当前博客的 /personal-blog/search.json 读取索引。
    CDN:

# lightbox：点击文章或图库中的图片时，使用 Fancybox 展示大图。
# Fancybox 的脚本和样式由 Butterfly 按需加载，不需要在本项目中额外安装依赖。
lightbox: fancybox

# busuanzi：使用 Butterfly 内置的不蒜子脚本展示基础访问统计。
# Hexo 只会生成统计数字的显示位置，实际数据由第三方不蒜子服务计算并返回。
busuanzi:
  # site_uv：显示全站访客数，用于近似表示访问过网站的不同访客数量。
  site_uv: true
  # site_pv：显示全站浏览量；打开或刷新不同页面都会让浏览次数继续累计。
  site_pv: true
  # page_pv：在文章页面显示当前文章的阅读次数。
  page_pv: true

# toc：文章目录设置。
toc:
  # post：是否在普通文章中显示目录。
  post: true
  # page：是否在独立页面中显示目录。
  page: false
  # number：是否显示章节编号。
  number: true
  # expand：是否默认展开所有目录层级。
  expand: false

# comments：评论系统总开关；当前没有选择评论服务，因此关闭。
comments:
  use:
  text: true
  lazyload: false
  count: false
  card_post_count: false

# aside：博客侧栏设置。
aside:
  # card_author：作者卡片及其跳转按钮。
  card_author:
    button:
      enable: true
      icon: fab fa-github
      text: 访问我的 GitHub
      link: https://github.com/cgd1029
  # card_announcement：侧栏公告卡片。
  card_announcement:
    enable: true
    content: 欢迎来到我的个人博客
  # card_webinfo：侧栏网站信息卡片，访问统计会显示在这张卡片中。
  card_webinfo:
    # enable：是否显示网站信息卡片。
    enable: true
    # post_count：是否显示已经发布的文章数量。
    post_count: true
    # last_push_date：是否显示网站最近更新时间。
    last_push_date: true
    # sort_order：卡片排序位置；留空时使用主题默认顺序。
    sort_order:
    # runtime_date：填写建站日期后可显示运行天数；当前留空，不显示该项目。
    runtime_date:
